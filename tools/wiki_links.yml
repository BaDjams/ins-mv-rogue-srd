# Dictionnaire de liens wiki — INS-MV ROGUE SRD (Astro/Starlight)
#
# Chaque entrée associe des termes à une page cible.
# - terms     : liste des expressions à lier (insensible à la casse)
# - target    : slug de la page cible (chemin relatif à src/content/docs/, sans .md)
# - anchor    : ancre optionnelle (#section)
# - first_only: true (défaut) → un seul lien par page ; false → toutes les occurrences
#
# L'outil génère automatiquement le chemin relatif correct selon la position
# du fichier source. Il ne lie jamais un terme à la page qui le définit.

links:

  # ── Résolution ──────────────────────────────────────────────────────────────
  - terms: ["D666"]
    target: "mecanique/resolution"

  - terms: ["marge de réussite"]
    target: "mecanique/resolution"

  - terms: ["dé d'intensité", "dé rouge"]
    target: "mecanique/resolution"

  - terms: ["avantage", "désavantage"]
    target: "mecanique/resolution"

  - terms: ["coup critique", "réussite critique"]
    target: "mecanique/resolution"

  - terms: ["intervention divine", "intervention démoniaque"]
    target: "mecanique/resolution"

  # ── Caractéristiques ────────────────────────────────────────────────────────
  - terms: ["caractéristiques", "attributs célestes"]
    target: "personnage/caracteristiques"

  # ── Rang céleste ─────────────────────────────────────────────────────────────
  - terms: ["rang céleste"]
    target: "personnage/rang"

  # ── Compétences ──────────────────────────────────────────────────────────────
  - terms: ["compétence", "compétences", "spécialisation"]
    target: "mecanique/competences"

  # ── Énergie ──────────────────────────────────────────────────────────────────
  - terms: ["points d'énergie", "points d'Énergie"]
    target: "mecanique/energie"

  - terms: ["drain"]
    target: "mecanique/energie"

  - terms: ["restauration de l'énergie"]
    target: "mecanique/energie"

  # ── Combat ───────────────────────────────────────────────────────────────────
  - terms: ["posture offensive", "posture défensive", "posture de concentration"]
    target: "mecanique/combat"

  - terms: ["initiative"]
    target: "mecanique/combat"

  - terms: ["action complexe", "action simple", "action gratuite"]
    target: "mecanique/combat"

  - terms: ["riposte"]
    target: "mecanique/combat"

  # ── Blessures ────────────────────────────────────────────────────────────────
  - terms: ["résilience"]
    target: "mecanique/blessures"

  - terms: ["points de vie"]
    target: "mecanique/blessures"

  # ── Réincarnation ────────────────────────────────────────────────────────────
  - terms: ["réincarnation", "se réincarner", "réincarne"]
    target: "personnage/reincarnation"

  # ── Mots-clés / traits ───────────────────────────────────────────────────────
  - terms: ["mots-clés", "mot-clé"]
    target: "reference/mots-cles"

  # ── États ─────────────────────────────────────────────────────────────────────
  - terms: ["sonné", "à terre", "inconscient", "mourant"]
    target: "reference/etats"
