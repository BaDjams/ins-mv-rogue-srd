  # ── Compétences ──────────────────────────────────────────────────────────────
  - terms: ["compétence", "compétences", "spécialisation"]
    target: "mecanique/competences"

  # ── Énergie ──────────────────────────────────────────────────────────────────
  - terms: ["points d'énergie", "points d'Énergie"]
    target: "mecanique/energie"

  - terms: ["drain"]
    target: "mecanique/energie"
    anchor: "rang-des-pouvoirs-et-drain"

  - terms: ["restauration de l'énergie"]
    target: "mecanique/energie"

  # ── Combat ───────────────────────────────────────────────────────────────────
  - terms: ["posture offensive", "posture défensive", "posture de concentration"]
    target: "mecanique/combat"
    anchor: "postures-tactiques"

  - terms: ["initiative"]
    target: "mecanique/combat"
    anchor: "initiative"

  - terms: ["action complexe", "action simple", "action gratuite"]
    target: "mecanique/combat"
    anchor: "déclaration-des-actions"

  - terms: ["riposte"]
    target: "mecanique/combat"
    anchor: "réactions"

  # ── Blessures ────────────────────────────────────────────────────────────────
  - terms: ["résilience"]
    target: "mecanique/blessures"

  - terms: ["points de vie"]
    target: "mecanique/blessures"

  # ── Réincarnation ────────────────────────────────────────────────────────────
  - terms: ["réincarnation", "se réincarner", "réincarne"]
    target: "personnage/reincarnation"

  # ── Mots-clés / traits ───────────────────────────────────────────────────────
  - terms: ["mots-clés", "mot-clé"]
    target: "reference/mots-cles"

  # ── États ─────────────────────────────────────────────────────────────────────
  - terms: ["sonné"]
    target: "reference/etats"
    anchor: "étourdi"

  - terms: ["à terre"]
    target: "reference/etats"
    anchor: "à-terre"

  - terms: ["inconscient"]
    target: "reference/etats"
    anchor: "inconscient"

  - terms: ["mourant"]
