backend:
  name: github
  repo: BaDjams/ins-mv-rogue-srd
  branch: main

# Décommenter pour utiliser le backend local (dev uniquement, sans OAuth)
# local_backend: true

media_folder: public/images
public_folder: /ins-mv-rogue-srd/images

# Locale par défaut
locale: fr

collections:
  # ─── Pages libres (Accueil, SRD, Simulateur, Générateur) ───────────────────
  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/docs
    create: false
    delete: false
    filter: { field: "sidebar.order", value_type: number }
    fields:
      - { label: Titre, name: title, widget: string }
      - label: Sidebar
        name: sidebar
        widget: object
        fields:
          - { label: Ordre, name: order, widget: number, value_type: int }
          - { label: Étiquette (optionnel), name: label, widget: string, required: false }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Contenu, name: body, widget: markdown }

  # ─── Contexte ───────────────────────────────────────────────────────────────
  - name: contexte
    label: Contexte
    label_singular: Page de contexte
    folder: src/content/docs/contexte
    create: true
    delete: true
    fields:
      - { label: Titre, name: title, widget: string }
      - label: Sidebar
        name: sidebar
        widget: object
        fields:
          - { label: Ordre, name: order, widget: number, value_type: int }
          - { label: Étiquette (optionnel), name: label, widget: string, required: false }
      - { label: Contenu, name: body, widget: markdown }

  # ─── Personnage ──────────────────────────────────────────────────────────────
  - name: personnage
    label: Personnage
    label_singular: Page Personnage
    folder: src/content/docs/personnage
    create: true
    delete: true
    fields:
      - { label: Titre, name: title, widget: string }
      - label: Sidebar
        name: sidebar
        widget: object
        fields:
          - { label: Ordre, name: order, widget: number, value_type: int }
          - { label: Étiquette (optionnel), name: label, widget: string, required: false }
      - { label: Contenu, name: body, widget: markdown }

  # ─── Mécanique ───────────────────────────────────────────────────────────────
  - name: mecanique
    label: Mécanique
    label_singular: Page Mécanique
    folder: src/content/docs/mecanique
    create: true
    delete: true
    fields:
      - { label: Titre, name: title, widget: string }
      - label: Sidebar
        name: sidebar
        widget: object
        fields:
          - { label: Ordre, name: order, widget: number, value_type: int }
          - { label: Étiquette (optionnel), name: label, widget: string, required: false }
      - { label: Contenu, name: body, widget: markdown }

  # ─── Référence ───────────────────────────────────────────────────────────────
  - name: reference
    label: Référence
    label_singular: Page Référence
    folder: src/content/docs/reference
    create: true
    delete: true
    fields:
      - { label: Titre, name: title, widget: string }
      - label: Sidebar
        name: sidebar
        widget: object
        fields:
          - { label: Ordre, name: order, widget: number, value_type: int }
          - { label: Étiquette (optionnel), name: label, widget: string, required: false }
      - { label: Contenu, name: body, widget: markdown }

  # ─── Équipement (sous-section de Référence) ──────────────────────────────────
  - name: equipement
    label: Équipement
    label_singular: Page Équipement
    folder: src/content/docs/reference/equipement
    create: true
    delete: true
    fields:
      - { label: Titre, name: title, widget: string }
      - label: Sidebar
        name: sidebar
        widget: object
        fields:
          - { label: Ordre, name: order, widget: number, value_type: int }
          - { label: Étiquette (optionnel), name: label, widget: string, required: false }
      - { label: Contenu, name: body, widget: markdown }

  # ─── Deck officiel : données versionnées, éditables depuis le CMS ──────────
  - name: deck_hotes
    label: Deck officiel des hôtes
    description: Paramétrage indépendant du jeu de 54 cartes de remplacement.
    files:
      - label: Répartition et hôtes spéciaux
        name: hotes_officiels
        file: public/data/hotes-officiels.json
        format: json
        fields:
          - label: Activer le deck officiel dans le générateur
            name: enabled
            widget: boolean
            default: false
          - label: Poids relatifs des hôtes ordinaires du deck officiel
            name: ordinaryWeights
            widget: object
            hint: "À déterminer par le créateur. Ce ne sont PAS les fréquences du jeu de 54 cartes. Zéro signifie qu'une qualité ne sort pas."
            fields:
              - { label: Gris, name: mundane, widget: number, value_type: int, min: 0 }
              - { label: Vert, name: better, widget: number, value_type: int, min: 0 }
              - { label: Bleu, name: superior, widget: number, value_type: int, min: 0 }
              - { label: Violet, name: elite, widget: number, value_type: int, min: 0 }
              - { label: Or, name: legendary, widget: number, value_type: int, min: 0 }
          - label: Hôtes spéciaux injectés
            name: specialHosts
            widget: list
            required: false
            summary: "{{fields.name}} — {{fields.dropRate}} %"
            hint: "Chaque taux est une probabilité par tirage indépendant. La somme des taux actifs doit être au maximum 100 %. L'ordre n'affecte pas les taux."
            fields:
              - { label: Identifiant unique, name: id, widget: string, hint: "Identifiant technique stable, par exemple nom-unique." }
              - { label: Nom sur la carte, name: name, widget: string }
              - label: Qualité de la carte
                name: quality
                widget: select
                options:
                  - { label: Gris, value: mundane }
                  - { label: Vert, value: better }
                  - { label: Bleu, value: superior }
                  - { label: Violet, value: elite }
                  - { label: Or, value: legendary }
              - { label: Taux de tirage (en pourcentage), name: dropRate, widget: number, value_type: float, min: 0, max: 100, hint: "Exemple purement numérique : 5 = 5 % des tirages pendant la période active." }
              - { label: Actif, name: active, widget: boolean, default: true }
              - { label: Début (UTC, inclus), name: startDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: Fin (UTC, inclus), name: endDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: Profession / rôle, name: occupation, widget: string, required: false }
              - { label: Description particulière, name: description, widget: text, required: false }
              - { label: Origine ou étiquette, name: origin, widget: string, required: false }
              - { label: Âge, name: age, widget: number, value_type: int, min: 0, required: false }
              - label: Genre
                name: gender
                widget: select
                required: false
                options:
                  - { label: Homme, value: male }
                  - { label: Femme, value: female }
                  - { label: Autre / sans objet, value: other }
              - { label: Portrait, name: image, widget: image, required: false }
              - label: Caractéristiques fixes
                name: attributes
                widget: object
                hint: "De 1 à 3 pour les hôtes ordinaires. Jusqu'à 5 uniquement pour les exceptions spéciales voulues par le créateur."
                fields:
                  - { label: Force (FOR), name: FOR, widget: number, value_type: int, min: 1, max: 5 }
                  - { label: Agilité (AGI), name: AGI, widget: number, value_type: int, min: 1, max: 5 }
                  - { label: Vigueur (VIG), name: VIG, widget: number, value_type: int, min: 1, max: 5 }
                  - { label: Perception (PER), name: PER, widget: number, value_type: int, min: 1, max: 5 }
              - label: Compétences fixes
                name: skills
                widget: list
                required: false
                summary: "{{fields.name}} ({{fields.bonus}})"
                fields:
                  - { label: Compétence, name: name, widget: string }
                  - label: Niveau
                    name: bonus
                    widget: select
                    options:
                      - { label: "Incompétent (-1)", value: -1 }
                      - { label: "Débutant (+0)", value: 0 }
                      - { label: "Confirmé (+1)", value: 1 }
                      - { label: "Professionnel (+2)", value: 2 }
                      - { label: "Expert (+3)", value: 3 }
              - { label: Traits fixes, name: traits, widget: list, field: { label: Trait, name: value, widget: string }, required: false }
              - { label: Équipement fixe, name: equipment, widget: list, field: { label: Objet, name: value, widget: string }, required: false }
