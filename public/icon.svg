<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="256" cy="256" r="204" />
    </clipPath>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d82c9" />
      <stop offset="1" stop-color="#1f4f85" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d94848" />
      <stop offset="1" stop-color="#8f2323" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" fill="#0f0f1a" />

  <!-- Halo doré discret -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#caa23a" stroke-opacity="0.35" stroke-width="3" />

  <!-- Disque ange / démon -->
  <g clip-path="url(#circle-clip)">
    <rect x="52" y="52" width="408" height="408" fill="url(#blue-grad)" />
    <path d="M 460 52 L 460 460 L 52 460 Z" fill="url(#red-grad)" />
  </g>

  <!-- Anneau doré -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#e9c765" stroke-width="10" />

  <!-- Sigle D666 : astérisque à 3 branches -->
  <g stroke="#f4e4b0" stroke-width="24" stroke-linecap="round">
    <line x1="256" y1="146" x2="256" y2="366" />
    <line x1="161" y1="201" x2="351" y2="311" />
    <line x1="351" y1="201" x2="161" y2="311" />
  </g>
  <circle cx="256" cy="256" r="21" fill="#0f0f1a" stroke="#f4e4b0" stroke-width="8" />
</svg>
